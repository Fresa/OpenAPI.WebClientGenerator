name: Continuous Delivery

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - '**'

env:
  repository: Fresa/OpenAPI.WebClientGenerator
  project_path: src/OpenAPI.WebClientGenerator
  project_name: OpenAPI.WebClientGenerator
  dotnet_version: 10.0.x
  
jobs:
  test:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        id: dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.dotnet_version }}
      - name: Build
        run: dotnet build -c Release
      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal
    outputs:
      dotnet_version: ${{ steps.dotnet.outputs.dotnet-version }}
      repository: ${{ env.repository }}
      project_path: ${{ env.project_path }}
      project_name: ${{ env.project_name }}

  release:
    name: Create Release
    uses: Fresa/Library.Net.ContinuousDelivery/.github/workflows/release.yml@v1
    needs: test
    if: github.repository == needs.test.outputs.repository && github.actor != 'dependabot[bot]'
    permissions: 
      contents: write
    with:
      project_path: ${{ needs.test.outputs.project_path }}
      project_name: ${{ needs.test.outputs.project_name }}
      dotnet_version: ${{ needs.test.outputs.dotnet_version }}
      include_github_release_notes: true
    secrets:
      nuget_api_key: ${{ secrets.NUGET_API_KEY }}
